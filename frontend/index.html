<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketPulse AI - Stock Sentiment Analyzer</title>

  <!-- Ndot 57 Aligned font -->
  <link href="https://db.onlinewebfonts.com/c/d7a74ed36ff0603a3e41b6da32c47f03?family=Ndot+57+Aligned" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix"></canvas>

  <!-- Brandmark / Logo -->
  <div class="brandmark">MarketPulse AI</div>

  <h1>Sentimental Analysis on Stock Market</h1>
  <p class="slogan">Decoding market mood, one post at a time</p>

  <div class="container">
    <label for="fileInput" class="upload-btn" id="uploadBtn">📤 Upload CSV File</label>
    <input type="file" id="fileInput" accept=".csv" />
    <div id="statusBox">
      <p id="awaiting">Awaiting file upload...</p>
      <p id="analyzing" style="display:none;">Analyzing sentiments...</p>
    </div>
    <div style="width:100%;display:flex;justify-content:center;">
      <button id="viewEdaBtn" class="upload-btn" style="display:none; margin-top:8px; background:linear-gradient(90deg,#ffd166,#ff9f1c);">View Analysis</button>
    </div>
  </div>

  <!-- Result Popup (structure will be generated by script) -->
  <div id="resultPopup" aria-hidden="true"></div>

  <div id="stock-ticker" aria-hidden="false">
    <div id="ticker-headlines">Loading live stocks...</div>
  </div>

  <footer>⚡ Powered by MarketPulse AI | Real-time Stock Insights</footer>

  <script src="script.js" defer></script>
</body>
</html>
