<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketPulse AI - Stock Sentiment Analyzer</title>

  <!-- Ndot 57 Aligned font -->
  <link href="https://db.onlinewebfonts.com/c/d7a74ed36ff0603a3e41b6da32c47f03?family=Ndot+57+Aligned" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix"></canvas>

  <!-- Brandmark / Logo -->
  <div class="brandmark">MarketPulse AI</div>

  <h1>Sentimental Analysis on Stock Market</h1>
  <p class="slogan">Decoding market mood, one post at a time</p>

  <div class="container">
    <label for="fileInput" class="upload-btn">📤 Upload CSV File</label>
    <input type="file" id="fileInput" accept=".csv" />
    <div id="statusBox">
      <p id="awaiting">Awaiting file upload...</p>
      <p id="analyzing" style="display:none;">Analyzing sentiments...</p>
    </div>
  </div>

  <!-- Result Popup (now includes typewriter AND EDA chart side-by-side) -->
  <div id="resultPopup" aria-hidden="true">
    <span class="popup-close" onclick="document.getElementById('resultPopup').classList.remove('show')">✖</span>

    <div class="popup-content">
      <!-- Left: Typewriter / Controls -->
      <div class="type-col">
        <div id="typewriter" role="status" aria-live="polite">Loading...</div>
        <span class="cursor" aria-hidden="true"></span>

        <div class="popup-controls">
          <button id="downloadCsv" class="download-btn">⬇ Download Results</button>
          <button id="closePopup" class="download-btn" onclick="document.getElementById('resultPopup').classList.remove('show')">Close</button>
        </div>
      </div>

      <!-- Right: EDA (chart + badges) -->
      <div class="eda-col" aria-label="Exploratory Data Analysis">
        <canvas id="edaChart" width="400" height="240"></canvas>
        <div class="eda-badges">
          <span id="posCount" class="badge pos">Positive: 0</span>
          <span id="neuCount" class="badge neu">Neutral: 0</span>
          <span id="negCount" class="badge neg">Negative: 0</span>
        </div>
      </div>
    </div>
  </div>

  <div id="stock-ticker">
    <div id="ticker-headlines">Loading live stocks...</div>
  </div>

  <footer>⚡ Powered by MarketPulse AI | Real-time Stock Insights</footer>

  <!-- Chart.js (CDN) - used by the popup EDA -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="script.js"></script>
</body>
</html>
