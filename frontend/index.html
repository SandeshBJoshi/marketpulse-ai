<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MarketPulse AI - Stock Sentiment Analyzer</title>

  <!-- Ndot 57 Aligned font -->
  <link href="https://db.onlinewebfonts.com/c/d7a74ed36ff0603a3e41b6da32c47f03?family=Ndot+57+Aligned" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix"></canvas>

  <!-- Brandmark / Logo -->
  <div class="brandmark">MarketPulse AI</div>

  <h1>Sentimental Analysis on Stock Market</h1>
  <p class="slogan">Decoding market mood, one post at a time</p>

  <div class="container">
    <label for="fileInput" id="uploadLabel" class="upload-btn">📤 Upload CSV File</label>
    <input type="file" id="fileInput" accept=".csv" />
    <div id="statusBox">
      <p id="awaiting">Awaiting file upload...</p>
      <p id="analyzing" style="display:none;">Analyzing sentiments...</p>
    </div>
  </div>

  <!-- Result Popup (typewriter + controls) -->
  <div id="resultPopup" aria-hidden="true">
    <button class="popup-close" id="closeResults">✖</button>
    <div class="popup-content">
      <div class="type-col">
        <div id="typewriter">Loading...</div>
        <div class="popup-controls">
          <button class="action-btn" id="downloadCsv" disabled>⬇ Download Results</button>
          <button class="action-btn" id="viewAnalysis" disabled>📊 View Analysis</button>
          <button class="action-btn" id="closeBtn">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Analysis popup with grid canvases (initially hidden) -->
  <div id="analysisPopup" aria-hidden="true">
    <div class="panel">
      <div class="analysis-header">
        <h3>IN-DEPTH MARKETPULSE EDA</h3>
        <button class="close-anal" id="closeAnal">✖</button>
      </div>

      <div class="analysis-grid">
        <div class="analysis-box"><canvas id="chart1" class="eda-canvas"></canvas></div>
        <div class="analysis-box"><canvas id="chart2" class="eda-canvas"></canvas></div>
        <div class="analysis-box"><canvas id="chart3" class="eda-canvas"></canvas></div>
        <div class="analysis-box" id="analysisInfo">
          <div id="summaryText" style="font-family:'Ndot 57 Aligned', monospace; color:#eafcff; font-weight:700;"></div>
          <div class="stat-row" style="margin-top:12px;">
            <div class="stat pos" id="statPos">Positive 0</div>
            <div class="stat neu" id="statNeu">Neutral 0</div>
            <div class="stat neg" id="statNeg">Negative 0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="stock-ticker">
    <div id="ticker-headlines">Loading live stocks...</div>
  </div>

  <footer>⚡ Powered by MarketPulse AI | Real-time Stock Insights</footer>

  <script src="script.js" defer></script>
</body>
</html>
